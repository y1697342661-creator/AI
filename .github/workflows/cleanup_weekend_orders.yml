# One-shot cleanup workflow to cancel duplicate weekend orders on Alpaca Paper & refresh account snapshot
name: Cleanup Duplicate Alpaca Paper Open Orders

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup_weekend_orders.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cancel-open-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-mu.txt"

      - name: Install minimal dependencies
        run: pip install -r requirements-mu.txt

      - name: Cancel all stale Alpaca Paper open orders & refresh snapshot
        env:
          PYTHONPATH: src
          ALPACA_PAPER_JSON: ${{ secrets.ALPACA_PAPER || secrets.AMEREICA }}
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: |
          python - <<'EOF'
          from mu_quant.rotation.alpaca_paper import (
              cancel_all_open_orders_and_wait,
              get_alpaca_open_orders,
              get_alpaca_paper_account,
              save_alpaca_account_snapshot,
          )
          before = get_alpaca_open_orders()
          print(f"Open orders BEFORE cancel: {len(before)}")
          rem = cancel_all_open_orders_and_wait(timeout_sec=15.0)
          after = get_alpaca_open_orders()
          print(f"Active open orders remaining: {len(rem)} | Raw open list: {len(after)}")
          acct = get_alpaca_paper_account()
          if acct.get("ok"):
              save_alpaca_account_snapshot(acct, after)
              print(f"Snapshot refreshed: equity=${acct['equity']:,.2f}, cash=${acct['cash']:,.2f}, positions={len(acct['positions'])}")
          EOF

      - name: Commit refreshed clean Alpaca snapshot
        run: |
          git config user.name "us-screener-executor-bot"
          git config user.email "us-screener-executor-bot@users.noreply.github.com"
          git add data/rotation/
          if ! git diff --cached --quiet; then
            git commit -m "chore(alpaca): cancel duplicate weekend open orders & refresh snapshot [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No snapshot changes to commit."
          fi
