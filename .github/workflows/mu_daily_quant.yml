# US Stock Full-Market Screener (latest_allocation.json) -> Alpaca Paper Trading Cloud Auto-Executor (Zero Leverage)
# Auto-handles US Daylight Saving Time (EDT/EST): always executes ~30 min after US market open (10:00 America/New_York)
name: US Stocks Screener-Linked Alpaca Paper Auto-Executor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mu_daily_quant.yml"
  schedule:
    # Summer (EDT, UTC-4): 14:00 UTC = 10:00 AM New York (22:00 Beijing) — 30 min after open
    - cron: "0 14 * * 1-5"
    # Winter (EST, UTC-5): 15:00 UTC = 10:00 AM New York (23:00 Beijing) — 30 min after open
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      execute_demo:
        description: "Auto-rebalance Alpaca Paper Trading from data/screener/latest_allocation.json (paper-api ONLY)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: us-rotation-alpaca
  cancel-in-progress: false

jobs:
  run-screener-alpaca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check US Eastern Time (Auto DST Switch — Run at ~10:00 AM New York, Skip Off-Season Slot)
        id: dst_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import datetime as dt, os
          from zoneinfo import ZoneInfo

          event = os.environ.get("EVENT_NAME", "")
          ny_now = dt.datetime.now(ZoneInfo("America/New_York"))
          print(f"Current New York time: {ny_now.strftime('%Y-%m-%d %H:%M:%S %Z')} (event={event})")

          if event != "schedule":
              print("Manual or push trigger: bypassing DST schedule gate.")
              should_run = "true"
          else:
              # Execute only inside 09:50 ~ 10:45 America/New_York (avoids opening 20-30 min spread chaos)
              mins = ny_now.hour * 60 + ny_now.minute
              if 9 * 60 + 50 <= mins <= 10 * 60 + 45:
                  print("Inside 10:00 AM New York execution window (30 min post-open). Proceeding.")
                  should_run = "true"
              else:
                  print("Outside 10:00 AM New York window (off-season DST cron slot). Skipping cleanly.")
                  should_run = "false"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={should_run}\n")
          EOF

      - name: Checkout repository
        if: steps.dst_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.dst_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-mu.txt"

      - name: Install minimal dependencies
        if: steps.dst_gate.outputs.should_run == 'true'
        run: pip install -r requirements-mu.txt

      - name: Execute Screener Allocation on Alpaca Paper Trading (paper-api.alpaca.markets ONLY)
        if: steps.dst_gate.outputs.should_run == 'true'
        env:
          PYTHONPATH: src
          ALPACA_PAPER_JSON: ${{ secrets.ALPACA_PAPER || secrets.AMEREICA }}
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EXECUTE: ${{ inputs.execute_demo }}
          VAR_AUTO_EXECUTE: ${{ vars.ROTATION_AUTO_EXECUTE }}
        run: |
          if [ -z "$ALPACA_PAPER_JSON" ] && [ -z "$ALPACA_PAPER_API_KEY" ]; then
            echo "No AMEREICA / ALPACA_PAPER secret configured; printing Screener allocation preview only."
            python src/mu_quant/rotation/runner.py --from-screener
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_EXECUTE" = "false" ]; then
            python src/mu_quant/rotation/runner.py --from-screener --sync-alpaca-paper --dry-run
          elif [ "$VAR_AUTO_EXECUTE" = "false" ]; then
            python src/mu_quant/rotation/runner.py --from-screener --sync-alpaca-paper --dry-run
          else
            python src/mu_quant/rotation/runner.py --from-screener --sync-alpaca-paper
          fi

      - name: Commit updated Alpaca Paper Trading ledger, risk state & account snapshot
        if: steps.dst_gate.outputs.should_run == 'true'
        run: |
          git config user.name "us-screener-executor-bot"
          git config user.email "us-screener-executor-bot@users.noreply.github.com"
          git add data/rotation/
          if ! git diff --cached --quiet; then
            git commit -m "chore(alpaca): screener-linked paper trading rebalance & snapshot [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No Alpaca order ledger or snapshot changes to commit."
          fi
