# Dedicated MU 2.0 cloud workflow (isolated MU / MU_OKX_DEMO_* secrets, zero leverage XMU-USDT spot only)
name: MU 2.0 Daily Quant & OKX Demo Cloud Runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mu_daily_quant.yml"
  schedule:
    # 1) Beijing Tue-Sat 07:00 (post US market close): refresh MU daily data + paper signal + forward scorecard
    - cron: "0 23 * * 1-5"
    # 2) Beijing Mon-Fri 22:35 (5 min after US winter open, inside US summer session): sync OKX Demo XMU-USDT spot
    - cron: "35 14 * * 1-5"
  workflow_dispatch:
    inputs:
      execute_demo:
        description: "Sync XMU-USDT spot position on OKX Simulated Trading (x-simulated-trading: 1 ONLY)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mu-daily-quant
  cancel-in-progress: false

jobs:
  run-mu-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-mu.txt"

      - name: Install minimal dependencies
        run: pip install -r requirements-mu.txt

      - name: Run MU Daily Data Refresh, Paper Signal & Forward Scorecard
        env:
          PYTHONPATH: src
        run: python src/mu_quant/paper_trading/daily_runner.py --force-refresh

      - name: Run 5-Asset Cross-Sector Rotation Data & Forward Paper Scorecard
        env:
          PYTHONPATH: src
        run: python src/mu_quant/rotation/runner.py

      - name: Run OKX Simulated Trading Sync (XMU-USDT Live-Liquidity Spot Only)
        env:
          PYTHONPATH: src
          MU_SECRET_JSON: ${{ secrets.MU }}
          MU_OKX_DEMO_API_KEY: ${{ secrets.MU_OKX_DEMO_API_KEY }}
          MU_OKX_DEMO_SECRET_KEY: ${{ secrets.MU_OKX_DEMO_SECRET_KEY }}
          MU_OKX_DEMO_PASSPHRASE: ${{ secrets.MU_OKX_DEMO_PASSPHRASE }}
          OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_SECRET_KEY: ${{ secrets.OKX_DEMO_SECRET_KEY }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          INPUT_EXECUTE: ${{ inputs.execute_demo }}
          VAR_AUTO_EXECUTE: ${{ vars.MU_AUTO_EXECUTE_DEMO }}
        run: |
          if [ -n "$MU_OKX_DEMO_API_KEY" ]; then
            echo "Secret source: dedicated MU_OKX_DEMO_* (isolated from BTC_OKX_DEMO_*)"
          elif [ -n "$MU_SECRET_JSON" ]; then
            echo "Secret source: dedicated MU JSON secret (isolated from BTC)"
          elif [ -n "$OKX_DEMO_API_KEY" ]; then
            echo "Secret source: fallback OKX_DEMO_*"
          else
            echo "No MU / MU_OKX_DEMO_API_KEY / OKX_DEMO_API_KEY secret configured; skipping OKX Demo sync."
            exit 0
          fi

          SHOULD_SYNC="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_EXECUTE" = "true" ]; then
            SHOULD_SYNC="true"
          elif [ "$EVENT_NAME" = "push" ] && [ "$VAR_AUTO_EXECUTE" != "false" ]; then
            SHOULD_SYNC="true"
          elif [ "$SCHEDULE_CRON" = "35 14 * * 1-5" ] && [ "$VAR_AUTO_EXECUTE" != "false" ]; then
            SHOULD_SYNC="true"
          fi

          if [ "$SHOULD_SYNC" = "true" ]; then
            echo "Executing XMU-USDT OKX Simulated Trading sync (only stock token with live demo market-maker)..."
            python src/mu_quant/paper_trading/okx_demo_runner.py
          else
            echo "Post-close data-only run (schedule=$SCHEDULE_CRON); skipping OKX Demo order outside US market hours."
          fi

      - name: Commit updated MU & 6-Asset Rotation data, forward scorecards & OKX demo logs
        run: |
          git config user.name "mu-quant-bot"
          git config user.email "mu-quant-bot@users.noreply.github.com"
          git add data/raw/ data/paper_trading/ data/okx_channel/ data/rotation/
          if ! git diff --cached --quiet; then
            git commit -m "chore(mu-rotation): daily data, forward scorecards & OKX demo sync [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No MU or Rotation data/ledger changes to commit."
          fi
