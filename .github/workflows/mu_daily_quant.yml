# Dedicated 10-Asset US Stock Cross-Sector Top-3 Dynamic Rotation (Alpaca Paper Trading ONLY, Zero Leverage, BTC Isolated)
name: US Stocks 10-Choose-3 Dynamic Rotation & Alpaca Paper Cloud Runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mu_daily_quant.yml"
  schedule:
    # 1) Beijing Tue-Sat 07:00 (post US market close): refresh 7 US stocks + update forward paper scorecard
    - cron: "0 23 * * 1-5"
    # 2) Beijing Mon-Fri 22:35 (5 min after US winter open, inside US summer session): auto-sync Alpaca Paper Trading
    - cron: "35 14 * * 1-5"
  workflow_dispatch:
    inputs:
      execute_demo:
        description: "Auto-rebalance 7 US stocks on Alpaca Paper Trading (paper-api.alpaca.markets ONLY)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: us-rotation-alpaca
  cancel-in-progress: false

jobs:
  run-us-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-mu.txt"

      - name: Install minimal dependencies
        run: pip install -r requirements-mu.txt

      - name: Run 7-Asset Cross-Sector Rotation Data, Paper Scorecard & Alpaca Paper Auto-Sync
        env:
          PYTHONPATH: src
          ALPACA_PAPER_JSON: ${{ secrets.ALPACA_PAPER || secrets.AMEREICA }}
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          INPUT_EXECUTE: ${{ inputs.execute_demo }}
          VAR_AUTO_EXECUTE: ${{ vars.ROTATION_AUTO_EXECUTE }}
        run: |
          python src/mu_quant/rotation/runner.py
          HAS_ALPACA="false"
          if [ -n "$ALPACA_PAPER_JSON" ] || [ -n "$ALPACA_PAPER_API_KEY" ]; then
            HAS_ALPACA="true"
          fi
          if [ "$HAS_ALPACA" = "true" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_EXECUTE" = "true" ]; then
              python src/mu_quant/rotation/runner.py --no-refresh --sync-alpaca-paper
            elif [ "$EVENT_NAME" = "push" ] && [ "$VAR_AUTO_EXECUTE" != "false" ]; then
              python src/mu_quant/rotation/runner.py --no-refresh --sync-alpaca-paper
            elif [ "$SCHEDULE_CRON" = "35 14 * * 1-5" ] && [ "$VAR_AUTO_EXECUTE" != "false" ]; then
              python src/mu_quant/rotation/runner.py --no-refresh --sync-alpaca-paper
            else
              echo "Post-close data-only run (schedule=$SCHEDULE_CRON); skipping Alpaca order outside US market hours."
            fi
          else
            echo "No ALPACA_PAPER secret configured; updated rotation paper scorecard only."
          fi

      - name: Commit updated 7-Asset Rotation data, forward scorecard & Alpaca Paper orders
        run: |
          git config user.name "us-rotation-bot"
          git config user.email "us-rotation-bot@users.noreply.github.com"
          git add data/rotation/
          if ! git diff --cached --quiet; then
            git commit -m "chore(rotation): daily 7-asset data, forward scorecard & Alpaca paper sync [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No rotation data/ledger changes to commit."
          fi
