name: BTC 4H Perpetual Quant Cloud Runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/btc_4h_quant.yml"
  schedule:
    # Run 2 minutes after every 4H candle closes (00:02, 04:02, 08:02, 12:02, 16:02, 20:02 UTC)
    - cron: "2 */4 * * *"
  workflow_dispatch:
    inputs:
      execute_demo:
        description: "Submit rebalance order to OKX Simulated Trading (x-simulated-trading: 1 ONLY)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: btc-4h-quant
  cancel-in-progress: false

jobs:
  run-btc-4h:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-btc.txt"

      - name: Install minimal dependencies
        run: pip install -r requirements-btc.txt

      - name: Run BTC 4H Data Refresh, Paper Ledger & OKX Demo Sync
        env:
          PYTHONPATH: src
          BTC_OKX_DEMO_API_KEY: ${{ secrets.BTC_OKX_DEMO_API_KEY }}
          BTC_OKX_DEMO_SECRET_KEY: ${{ secrets.BTC_OKX_DEMO_SECRET_KEY }}
          BTC_OKX_DEMO_PASSPHRASE: ${{ secrets.BTC_OKX_DEMO_PASSPHRASE }}
          FALLBACK_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          FALLBACK_SECRET_KEY: ${{ secrets.OKX_DEMO_SECRET_KEY }}
          FALLBACK_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
          VAR_AUTO_EXECUTE: ${{ vars.BTC_AUTO_EXECUTE_DEMO }}
          INPUT_EXECUTE: ${{ inputs.execute_demo }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          export OKX_DEMO_API_KEY="${BTC_OKX_DEMO_API_KEY:-$FALLBACK_API_KEY}"
          export OKX_DEMO_SECRET_KEY="${BTC_OKX_DEMO_SECRET_KEY:-$FALLBACK_SECRET_KEY}"
          export OKX_DEMO_PASSPHRASE="${BTC_OKX_DEMO_PASSPHRASE:-$FALLBACK_PASSPHRASE}"

          if [ -z "$OKX_DEMO_API_KEY" ]; then
            echo "No BTC_OKX_DEMO_API_KEY / OKX_DEMO_API_KEY secret configured; running paper ledger only."
            python -m btc_quant.paper_trading.runner --refresh
            exit 0
          fi

          SHOULD_EXEC="true"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_EXECUTE" = "false" ]; then
            SHOULD_EXEC="false"
          elif [ "$VAR_AUTO_EXECUTE" = "false" ]; then
            SHOULD_EXEC="false"
          fi

          if [ "$SHOULD_EXEC" = "true" ]; then
            echo "Executing BTC-USDT-SWAP OKX Simulated Trading sync (x-simulated-trading: 1, isolated)..."
            python -m btc_quant.paper_trading.runner --refresh --sync-okx-demo --execute-demo
          else
            echo "Dry-run preview mode..."
            python -m btc_quant.paper_trading.runner --refresh --sync-okx-demo
          fi

      - name: Commit updated BTC paper trading ledger & data
        run: |
          git config user.name "btc-quant-bot"
          git config user.email "btc-quant-bot@users.noreply.github.com"
          git add data/btc/paper_trading/ data/btc/okx_demo/ data/btc/raw/_last_refresh.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(btc): 4H paper trading & demo sync update [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No ledger changes to commit."
          fi
